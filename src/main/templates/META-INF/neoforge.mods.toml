modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ars_nouveau"
type="required"
versionRange="[${ars_nouveau_version},)"
ordering="AFTER"
side="BOTH"

# Sable compatibility is optional: the patch works without it. Loading after it keeps
# the dependency graph predictable; mixin application order is controlled by priority.
[[dependencies.${mod_id}]]
modId="ars_sable"
type="optional"
versionRange="[${ars_sable_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="optional"
versionRange="[${sable_version_range},)"
ordering="AFTER"
side="BOTH"
